<!doctype html><html><head>
<script type="application/json" id="motif-manifest">
{
  "id": "wic-lower-third",
  "name": "WIC Lower Third",
  "version": 1,
  "size": [
    1920,
    1080
  ],
  "default_duration_s": 5,
  "max_duration_s": null,
  "max_duration_prop": null,
  "content_duration_s": 0.8,
  "fonts": [],
  "props_schema": {
    "name": {
      "type": "string",
      "default": "DEVIN WENIG",
      "max_length": 40
    },
    "role": {
      "type": "string",
      "default": "Former eBay CEO",
      "max_length": 70
    },
    "status": {
      "type": "string",
      "default": "Not criminally charged",
      "max_length": 60
    },
    "side": {
      "type": "enum",
      "options": [
        "left",
        "right"
      ],
      "default": "left"
    }
  }
}
</script>


<meta charset="utf-8"><style>
@font-face{font-family:"WIC Bebas";src:url(data:font/woff2;base64,__WIC_BEBAS__) format("woff2")}
@font-face{font-family:"WIC Inter";src:url(data:font/woff2;base64,__WIC_INTER500__) format("woff2");font-weight:500}
@font-face{font-family:"WIC InterB";src:url(data:font/woff2;base64,__WIC_INTER700__) format("woff2");font-weight:700}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent}
#b{position:absolute;bottom:244px;padding:16px 34px 18px 28px;border-left:8px solid #D32222;
background:linear-gradient(90deg,rgba(11,11,11,.88),rgba(31,31,31,.78));box-shadow:0 10px 30px rgba(0,0,0,.35)}
#b.right{border-left:none;border-right:8px solid #D32222;text-align:right;padding:16px 28px 18px 34px}
#n{font-family:"WIC Bebas",sans-serif;font-size:76px;line-height:.95;color:#EDEDED;letter-spacing:1px}
#r{font-family:"WIC Inter",sans-serif;font-weight:500;font-size:32px;color:#EDEDED;opacity:.88;margin-top:4px}
#s{font-family:"WIC InterB",sans-serif;font-weight:700;font-size:22px;letter-spacing:2.5px;color:#D32222;text-transform:uppercase;margin-top:10px}
</style></head><body><div id="b"><div id="n"></div><div id="r"></div><div id="s"></div></div><script>
var b=document.getElementById('b');
motif.define({setup: async function(p){
  document.getElementById('n').textContent=p.name||''; document.getElementById('r').textContent=p.role||'';
  var s=document.getElementById('s'); s.textContent=p.status||''; s.style.display=p.status?'block':'none';
  var right=p.side==='right'; b.className=right?'right':''; b.style.left=right?'':'96px'; b.style.right=right?'96px':'';
  b.animate([{opacity:0,transform:'translateX('+(right?40:-40)+'px)'},{opacity:1,transform:'none'}],{duration:650,easing:'cubic-bezier(.16,1,.3,1)',fill:'both'});
  await Promise.all([document.fonts.load('76px "WIC Bebas"'),document.fonts.load('500 32px "WIC Inter"'),document.fonts.load('700 22px "WIC InterB"')]);
}});
</script></body></html>
