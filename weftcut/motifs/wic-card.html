<!doctype html><html><head>
<script type="application/json" id="motif-manifest">
{
  "id": "wic-card",
  "name": "WIC Card",
  "version": 1,
  "size": [
    1920,
    1080
  ],
  "default_duration_s": 4,
  "max_duration_s": null,
  "max_duration_prop": null,
  "content_duration_s": 1,
  "fonts": [],
  "props_schema": {
    "kicker": {
      "type": "string",
      "default": "PART TWO",
      "max_length": 40
    },
    "title": {
      "type": "string",
      "default": "AUGUST 2019",
      "max_length": 60,
      "multiline": true
    },
    "sub": {
      "type": "string",
      "default": "The first packages arrive in Natick, Massachusetts",
      "max_length": 120
    },
    "background": {
      "type": "enum",
      "options": [
        "solid",
        "none"
      ],
      "default": "solid"
    },
    "align": {
      "type": "enum",
      "options": [
        "left",
        "center"
      ],
      "default": "left"
    }
  }
}
</script>


<meta charset="utf-8"><style>
@font-face{font-family:"WIC Bebas";src:url(data:font/woff2;base64,__WIC_BEBAS__) format("woff2")}
@font-face{font-family:"WIC Inter";src:url(data:font/woff2;base64,__WIC_INTER500__) format("woff2");font-weight:500}
@font-face{font-family:"WIC InterB";src:url(data:font/woff2;base64,__WIC_INTER700__) format("woff2");font-weight:700}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent}
#bg{position:absolute;inset:0;background:radial-gradient(ellipse at 30% 40%,#1F1F1F 0%,#0B0B0B 70%)}
#grain{position:absolute;inset:0;opacity:.07;background-image:repeating-radial-gradient(circle at 17% 32%,#fff 0 1px,transparent 1px 3px),repeating-radial-gradient(circle at 71% 64%,#fff 0 1px,transparent 1px 4px)}
#box{position:absolute;left:160px;right:160px;top:0;bottom:216px;display:flex;flex-direction:column;justify-content:center}
#box.center{align-items:center;text-align:center}
#k{font-family:"WIC InterB",sans-serif;font-weight:700;font-size:28px;letter-spacing:6px;color:#D32222}
#t{font-family:"WIC Bebas",sans-serif;font-size:190px;line-height:.9;color:#EDEDED;margin-top:12px;white-space:pre-line}
#l{width:140px;height:6px;background:#D32222;margin-top:26px}
#s{font-family:"WIC Inter",sans-serif;font-weight:500;font-size:40px;color:#EDEDED;opacity:.88;margin-top:26px;max-width:1300px;line-height:1.25}
</style></head><body><div id="bg"></div><div id="grain"></div><div id="box"><div id="k"></div><div id="t"></div><div id="l"></div><div id="s"></div></div><script>
motif.define({setup: async function(p){
  var solid=p.background!=='none'; document.getElementById('bg').style.display=solid?'block':'none'; document.getElementById('grain').style.display=solid?'block':'none';
  document.getElementById('box').className=p.align==='center'?'center':'';
  var k=document.getElementById('k'),t=document.getElementById('t'),l=document.getElementById('l'),s=document.getElementById('s');
  k.textContent=p.kicker||''; k.style.display=p.kicker?'block':'none'; t.textContent=p.title||''; s.textContent=p.sub||''; s.style.display=p.sub?'block':'none';
  k.animate([{opacity:0},{opacity:1}],{duration:400,fill:'both'});
  t.animate([{opacity:0,transform:'translateY(24px)'},{opacity:1,transform:'none'}],{duration:650,delay:120,easing:'cubic-bezier(.16,1,.3,1)',fill:'both'});
  l.animate([{transform:'scaleX(0)'},{transform:'scaleX(1)'}],{duration:450,delay:400,easing:'cubic-bezier(.16,1,.3,1)',fill:'both'}); l.style.transformOrigin=p.align==='center'?'center':'left';
  s.animate([{opacity:0},{opacity:.88}],{duration:450,delay:550,fill:'both'});
  await Promise.all([document.fonts.load('190px "WIC Bebas"'),document.fonts.load('500 40px "WIC Inter"'),document.fonts.load('700 28px "WIC InterB"')]);
}});
</script></body></html>
