<!doctype html><html><head>
<script type="application/json" id="motif-manifest">
{
  "id": "wic-status-tag",
  "name": "WIC Status Tag",
  "version": 1,
  "size": [
    1920,
    1080
  ],
  "default_duration_s": 4,
  "max_duration_s": null,
  "max_duration_prop": null,
  "content_duration_s": 0.5,
  "fonts": [],
  "props_schema": {
    "text": {
      "type": "string",
      "default": "NOT A JUDGMENT",
      "max_length": 40
    },
    "x_pct": {
      "type": "number",
      "default": 72,
      "min": 0,
      "max": 100
    },
    "y_pct": {
      "type": "number",
      "default": 30,
      "min": 0,
      "max": 78
    },
    "size": {
      "type": "number",
      "default": 64,
      "min": 30,
      "max": 160
    },
    "tone": {
      "type": "enum",
      "options": [
        "red",
        "white"
      ],
      "default": "red"
    }
  }
}
</script>


<meta charset="utf-8"><style>
@font-face{font-family:"WIC Bebas";src:url(data:font/woff2;base64,__WIC_BEBAS__) format("woff2")}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent}
#g{position:absolute;transform:translate(-50%,-50%);font-family:"WIC Bebas",sans-serif;letter-spacing:2px;line-height:1;padding:.16em .42em .08em;
border:4px solid #D32222;color:#EDEDED;background:rgba(11,11,11,.86);white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.45)}
#g.white{border-color:#EDEDED;color:#0B0B0B;background:#EDEDED}
</style></head><body><div id="g"></div><script>
var g=document.getElementById('g');
motif.define({setup: async function(p){
  g.textContent=p.text||''; g.className=p.tone==='white'?'white':'';
  g.style.left=(p.x_pct==null?72:p.x_pct)+'%'; g.style.top=(p.y_pct==null?30:p.y_pct)+'%'; g.style.fontSize=(p.size||64)+'px';
  g.animate([{opacity:0,transform:'translate(-50%,-50%) scale(1.08)'},{opacity:1,transform:'translate(-50%,-50%) scale(1)'}],{duration:350,easing:'cubic-bezier(.16,1,.3,1)',fill:'both'});
  await document.fonts.load((p.size||64)+'px "WIC Bebas"');
}});
</script></body></html>
