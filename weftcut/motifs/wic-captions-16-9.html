</style></head><body><div id="cap"></div><script>
var cap=document.getElementById('cap'), CUES=[], P={};
function buildCues(words,maxc){
  var cues=[],cur=[],len=0;
  function push(){ if(cur.length){cues.push(cur);} cur=[];len=0; }
  for(var i=0;i<words.length;i++){
    var w=words[i], add=(len?1:0)+w.w.length, prev=cur[cur.length-1];

    if(cur.length && (len+add>maxc*2 || gap>0.7 || (endS && len>maxc*0.6))) push();
    cur.push(w); len+=(len?1:0)+w.w.length;
  }
  push();
  return cues.map(function(c,k){
    var total=c.reduce(function(a,w){return a+w.w.length+1;},-1), lines=[c];
    if(total>maxc){ var acc=0,best=1,bd=1e9; for(var j=0;j<c.length-1;j++){acc+=c[j].w.length+1; var d=Math.abs(acc-total/2); if(d<bd){bd=d;best=j+1;}} lines=[c.slice(0,best),c.slice(best)]; }
    var next=cues[k+1];
    return {s:c[0].s, e: next? Math.min(next[0].s, c[c.length-1].e+0.6) : c[c.length-1].e+0.6, lines:lines, words:c};
