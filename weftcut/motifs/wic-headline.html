<!doctype html><html><head>
<script type="application/json" id="motif-manifest">
{
  "id": "wic-headline",
  "name": "WIC Headline",
  "version": 1,
  "size": [
    1920,
    1080
  ],
  "default_duration_s": 5,
  "max_duration_s": null,
  "max_duration_prop": null,
  "content_duration_s": 0.9,
  "fonts": [],
  "props_schema": {
    "headline": {
      "type": "string",
      "default": "THE COST OF *SILENCE*",
      "max_length": 80,
      "multiline": true
    },
    "support": {
      "type": "string",
      "default": "eBay paid $3 million under a deferred prosecution agreement",
      "max_length": 140
    },
    "align": {
      "type": "enum",
      "options": [
        "left",
        "center",
        "right"
      ],
      "default": "left"
    },
    "v_pos": {
      "type": "enum",
      "options": [
        "top",
        "middle"
      ],
      "default": "top"
    },
    "size": {
      "type": "number",
      "default": 132,
      "min": 60,
      "max": 260
    },
    "underline": {
      "type": "enum",
      "options": [
        "yes",
        "no"
      ],
      "default": "yes"
    }
  }
}
</script>


<meta charset="utf-8"><style>
@font-face{font-family:"WIC Bebas";src:url(data:font/woff2;base64,__WIC_BEBAS__) format("woff2")}
@font-face{font-family:"WIC Inter";src:url(data:font/woff2;base64,__WIC_INTER500__) format("woff2");font-weight:500}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent}
#box{position:absolute;left:120px;right:120px;display:flex;flex-direction:column}
#h{font-family:"WIC Bebas",sans-serif;color:#EDEDED;line-height:.92;letter-spacing:1px;text-shadow:0 4px 18px rgba(0,0,0,.55);white-space:pre-line}
#h em{font-style:normal;color:#D32222}
#u{height:8px;width:180px;background:#D32222;margin-top:22px;transform-origin:left center}
#s{font-family:"WIC Inter",sans-serif;font-weight:500;font-size:40px;color:#EDEDED;opacity:.9;margin-top:22px;max-width:1150px;line-height:1.25;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.center{align-items:center;text-align:center}.center #u{transform-origin:center}
.right{align-items:flex-end;text-align:right}.right #u{transform-origin:right center}
</style></head><body><div id="box"><div id="h"></div><div id="u"></div><div id="s"></div></div><script>
var box=document.getElementById('box'),h=document.getElementById('h'),u=document.getElementById('u'),s=document.getElementById('s');
function esc(x){return String(x||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');}
motif.define({setup: async function(p){
  box.className=p.align||'left';
  h.style.fontSize=(p.size||132)+'px';
  h.innerHTML=esc(p.headline).replace(/\*([^*]+)\*/g,'<em>$1</em>');
  s.textContent=p.support||''; s.style.display=p.support?'block':'none';
  u.style.display=p.underline==='no'?'none':'block';
  if(p.v_pos==='middle'){box.style.top='0';box.style.bottom='216px';box.style.justifyContent='center';}else{box.style.top='130px';}
  h.animate([{opacity:0,transform:'translateY(18px)'},{opacity:1,transform:'none'}],{duration:550,easing:'cubic-bezier(.16,1,.3,1)',fill:'both'});
  u.animate([{transform:'scaleX(0)'},{transform:'scaleX(1)'}],{duration:450,delay:250,easing:'cubic-bezier(.16,1,.3,1)',fill:'both'});
  s.animate([{opacity:0},{opacity:.9}],{duration:450,delay:380,easing:'ease-out',fill:'both'});
  await Promise.all([document.fonts.load((p.size||132)+'px "WIC Bebas"'),document.fonts.load('500 40px "WIC Inter"')]);
}});
</script></body></html>
