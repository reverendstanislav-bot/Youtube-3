<!doctype html><html><head>
<script type="application/json" id="motif-manifest">
{
  "id": "wic-quote",
  "name": "WIC Quote",
  "version": 1,
  "size": [
    1920,
    1080
  ],
  "default_duration_s": 6,
  "max_duration_s": null,
  "max_duration_prop": null,
  "content_duration_s": 0.9,
  "fonts": [],
  "props_schema": {
    "quote": {
      "type": "string",
      "default": "We need to *crush this lady.*",
      "max_length": 260,
      "multiline": true
    },
    "attribution": {
      "type": "string",
      "default": "Text message cited in DOJ charging documents",
      "max_length": 100
    },
    "background": {
      "type": "enum",
      "options": [
        "panel",
        "none"
      ],
      "default": "panel"
    },
    "size": {
      "type": "number",
      "default": 72,
      "min": 36,
      "max": 140
    }
  }
}
</script>


<meta charset="utf-8"><style>
@font-face{font-family:"WIC Gara";src:url(data:font/woff2;base64,__WIC_GARAMOND_I__) format("woff2");font-style:italic}
@font-face{font-family:"WIC InterB";src:url(data:font/woff2;base64,__WIC_INTER700__) format("woff2");font-weight:700}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent}
#box{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:1320px;padding:48px 60px 44px 64px;border-left:8px solid #D32222}
#box.panel{background:rgba(11,11,11,.84);box-shadow:0 18px 50px rgba(0,0,0,.5)}
#q{font-family:"WIC Gara",serif;font-style:italic;color:#EDEDED;line-height:1.18}
#q em{font-style:italic;color:#D32222}
#q:before{content:"\201C";color:#D32222;margin-right:6px}#q:after{content:"\201D";color:#D32222;margin-left:4px}
#a{font-family:"WIC InterB",sans-serif;font-weight:700;font-size:22px;letter-spacing:2.6px;color:#EDEDED;opacity:.78;text-transform:uppercase;margin-top:28px}
</style></head><body><div id="box"><div id="q"></div><div id="a"></div></div><script>
function esc(x){return String(x||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');}
motif.define({setup: async function(p){
  var box=document.getElementById('box'),q=document.getElementById('q'),a=document.getElementById('a');
  box.className=p.background==='none'?'':'panel'; q.style.fontSize=(p.size||72)+'px';
  q.innerHTML=esc(p.quote).replace(/\*([^*]+)\*/g,'<em>$1</em>'); a.textContent=p.attribution||'';
  box.animate([{opacity:0},{opacity:1}],{duration:500,fill:'both'});
  q.animate([{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}],{duration:600,delay:100,easing:'cubic-bezier(.16,1,.3,1)',fill:'both'});
  a.animate([{opacity:0},{opacity:.78}],{duration:400,delay:450,fill:'both'});
  await Promise.all([document.fonts.load('italic '+(p.size||72)+'px "WIC Gara"'),document.fonts.load('700 22px "WIC InterB"')]);
}});
</script></body></html>
