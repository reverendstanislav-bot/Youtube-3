name: VIDEO004 source geometry proof
on:
  push:
    paths:
      - '.github/workflows/video004_source_geometry.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF geometry dependency
        run: python -m pip install --quiet pymupdf
      - name: Download, hash and inspect original PDF sources
        run: python 03_VIDEOS/VIDEO_004_VALVE_STEAM_MASS_ARBITRATION/12_EXTRACT_SOURCE_GEOMETRY.py
      - name: Commit geometry receipt only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 03_VIDEOS/VIDEO_004_VALVE_STEAM_MASS_ARBITRATION/12_SOURCE_DOCUMENT_GEOMETRY.json
          if ! git diff --cached --quiet; then
            git commit -m "video004 verify PDF phrase bboxes against actual source files"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VIDEO004_VERIFIED_ORIGINAL_PDF_SOURCES
          path: |
            03_VIDEOS/VIDEO_004_VALVE_STEAM_MASS_ARBITRATION/12_SOURCE_DOCUMENT_GEOMETRY.json
            03_VIDEOS/VIDEO_004_VALVE_STEAM_MASS_ARBITRATION/12_SOURCE_PDF_DOWNLOADS/*.pdf
          if-no-files-found: warn
