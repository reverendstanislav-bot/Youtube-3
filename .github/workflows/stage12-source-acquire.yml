name: stage12-source-acquire
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/stage12-source-acquire.yml

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download source assets
        run: |
          set -u
          BASE="03_VIDEOS/VIDEO_001_THE_EBAY_HARASSMENT_SCANDAL_THAT_COST_56_MILLION/12B_SOURCE_ASSETS"
          mkdir -p "$BASE"
          : > "$BASE/ACQUIRE_LOG.csv"
          echo "file,status,url" >> "$BASE/ACQUIRE_LOG.csv"

          fetch() {
            url="$1"
            file="$2"
            echo "Downloading $file"
            if curl -L --fail --retry 4 --retry-delay 2 --connect-timeout 30 --max-time 300 -A "Mozilla/5.0" "$url" -o "$BASE/$file"; then
              if [ -s "$BASE/$file" ]; then
                echo "\"$file\",OK,\"$url\"" >> "$BASE/ACQUIRE_LOG.csv"
              else
                rm -f "$BASE/$file"
                echo "\"$file\",EMPTY,\"$url\"" >> "$BASE/ACQUIRE_LOG.csv"
              fi
            else
              rm -f "$BASE/$file"
              echo "\"$file\",FAILED,\"$url\"" >> "$BASE/ACQUIRE_LOG.csv"
            fi
          }

          fetch "https://www.govinfo.gov/content/pkg/USCOURTS-mad-1_21-cv-11181/pdf/USCOURTS-mad-1_21-cv-11181-3.pdf" "S009_D711_SUMMARY_JUDGMENT_ORDER.pdf"
          fetch "https://www.justice.gov/usao-ma/media/1333086/dl" "S003_EBAY_CRIMINAL_INFORMATION.pdf"
          fetch "https://www.justice.gov/sites/default/files/styles/d05/public/2024-07/gilbert_pr_image_1.jpg?itok=IQtSIX7y" "DOJ_FBI_PIG_MASK_AND_BOOK.jpg"
          fetch "https://attorneywire.com/wp-content/uploads/2026/07/Steiner_et_al_v_eBay_Inc_et_al__madce-21-11181__0986.0.pdf" "S020_D986_STIPULATION_DISMISSAL.pdf"
          fetch "https://commons.wikimedia.org/wiki/Special:Redirect/file/EBay_headquarters_2018.jpg?width=2560" "EBAY_HQ_2018_CC_BY_SA.jpg"
          fetch "https://commons.wikimedia.org/wiki/Special:Redirect/file/Natick_spring_2020.jpg?width=2560" "NATICK_CENTER_2020_CC_BY_SA.jpg"
          fetch "https://commons.wikimedia.org/wiki/Special:Redirect/file/Bacon_Free_Library_-_South_Natick,_MA_-_DSC09574.jpg?width=2560" "SOUTH_NATICK_BACON_LIBRARY_CC0.jpg"
          fetch "https://commons.wikimedia.org/wiki/Special:Redirect/file/A_cockroach.jpg?width=1920" "COCKROACH_CC0.jpg"
          fetch "https://commons.wikimedia.org/wiki/Special:Redirect/file/Spider_image_view.jpg?width=1920" "SPIDER_CC0.jpg"
          fetch "https://commons.wikimedia.org/wiki/Special:Redirect/file/Sawfly_larvae_on_globemallow_(Symphyta)_(30098020405).jpg?width=1920" "LARVAE_CC0.jpg"
          fetch "https://commons.wikimedia.org/wiki/Special:Redirect/file/Parcel_box_and_mailbox.webp?width=1920" "PARCEL_CC0.webp"
          fetch "https://commons.wikimedia.org/wiki/Special:Redirect/file/Funeral_wreath_09_27_1421u.JPG?width=1920" "FUNERAL_WREATH_CC0.jpg"
          fetch "https://commons.wikimedia.org/wiki/Special:Redirect/file/Kippy_Tracker_Device.jpg?width=1920" "GENERIC_GPS_TRACKER_CC0.jpg"
          fetch "https://commons.wikimedia.org/wiki/Special:Redirect/file/Office_interior_2022_queue.jpg?width=2560" "OFFICE_INTERIOR_CC0.jpg"
          fetch "https://commons.wikimedia.org/wiki/Special:Redirect/file/Wooden_fence_-_Arlington,_MA_-_02.jpg?width=2560" "MASSACHUSETTS_FENCE_CC0.jpg"
          fetch "https://naturalearth.s3.amazonaws.com/110m_cultural/ne_110m_admin_0_countries.zip" "NATURAL_EARTH_110M_ADMIN0_COUNTRIES.zip"

          {
            echo "file,bytes,sha256"
            find "$BASE" -maxdepth 1 -type f ! -name SOURCE_ASSET_CHECKSUMS.csv -printf '%f\n' | sort | while read -r f; do
              bytes=$(stat -c%s "$BASE/$f")
              sha=$(sha256sum "$BASE/$f" | awk '{print $1}')
              echo "\"$f\",$bytes,$sha"
            done
          } > "$BASE/SOURCE_ASSET_CHECKSUMS.csv"

      - name: Commit downloaded assets
        run: |
          set -e
          git config user.name "youtube3-source-acquisition"
          git config user.email "youtube3-source-acquisition@users.noreply.github.com"
          rm -f .github/workflows/stage12-source-acquire.yml
          git add -A
          git commit -m "Acquire VIDEO_001 real Stage 12 source assets [skip ci]"
          git push origin HEAD:main
