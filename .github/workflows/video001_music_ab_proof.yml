name: VIDEO001 Music AB Proof

on:
  workflow_dispatch:
  push:
    paths:
      - '03_VIDEOS/VIDEO_001_THE_EBAY_HARASSMENT_SCANDAL_THAT_COST_56_MILLION/15C_MUSIC_AB_TRIGGER.txt'

permissions:
  contents: read

jobs:
  build-ab-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Rebuild canonical Stage15B
        run: |
          python3 "03_VIDEOS/VIDEO_001_THE_EBAY_HARASSMENT_SCANDAL_THAT_COST_56_MILLION/15B_BUILD.py"

      - name: Download TeknoAXE candidates
        shell: bash
        run: |
          set -e
          ROOT="03_VIDEOS/VIDEO_001_THE_EBAY_HARASSMENT_SCANDAL_THAT_COST_56_MILLION/15C_MUSIC_AB"
          mkdir -p "$ROOT/music" "$ROOT/out"
          curl -LfsS 'https://teknoaxe.com/direct_download.php?file=Subroutine_A.mp3' -o "$ROOT/music/Subroutine_A.mp3"
          curl -LfsS 'https://teknoaxe.com/direct_download.php?file=Stripped_to_the_Bones.mp3' -o "$ROOT/music/Stripped_to_the_Bones.mp3"
          curl -LfsS 'https://teknoaxe.com/direct_download.php?file=Unusual_Interruptions.mp3' -o "$ROOT/music/Unusual_Interruptions.mp3"
          curl -LfsS 'https://teknoaxe.com/direct_download.php?file=Outpost_Alpha.mp3' -o "$ROOT/music/Outpost_Alpha.mp3"
          curl -LfsS 'https://teknoaxe.com/direct_download.php?file=High_Tech_Suspense_Intro.mp3' -o "$ROOT/music/High_Tech_Suspense_Intro.mp3"
          curl -LfsS 'https://teknoaxe.com/direct_download.php?file=Darker_Turns.mp3' -o "$ROOT/music/Darker_Turns.mp3"

      - name: Build A/B proofs on real film
        shell: bash
        run: |
          set -e
          ROOT="03_VIDEOS/VIDEO_001_THE_EBAY_HARASSMENT_SCANDAL_THAT_COST_56_MILLION/15C_MUSIC_AB"
          SRC="03_VIDEOS/VIDEO_001_THE_EBAY_HARASSMENT_SCANDAL_THAT_COST_56_MILLION/15B_OUTPUT/VIDEO_001_STAGE15B_REVIEW_V1_1080P.mp4"
          python3 - <<'PY'
          import subprocess, pathlib
          root=pathlib.Path("03_VIDEOS/VIDEO_001_THE_EBAY_HARASSMENT_SCANDAL_THAT_COST_56_MILLION/15C_MUSIC_AB")
          src=pathlib.Path("03_VIDEOS/VIDEO_001_THE_EBAY_HARASSMENT_SCANDAL_THAT_COST_56_MILLION/15B_OUTPUT/VIDEO_001_STAGE15B_REVIEW_V1_1080P.mp4")
          scenes=[("opening",0.0,26.0),("messages",165.0,26.0),("money",762.0,26.0),("ending",860.0,26.0)]
          A=[("Subroutine_A.mp3",22.0),("Stripped_to_the_Bones.mp3",30.0),("Unusual_Interruptions.mp3",38.0),("Outpost_Alpha.mp3",42.0)]
          B=[("Outpost_Alpha.mp3",12.0),("High_Tech_Suspense_Intro.mp3",0.5),("Darker_Turns.mp3",12.0),("Unusual_Interruptions.mp3",96.0)]

          def make(direction,tracks):
              clips=[]
              for i,((name,start,dur),(track,offset)) in enumerate(zip(scenes,tracks),1):
                  out=root/"out"/f"{direction}_{i:02d}_{name}.mp4"
                  label=f"MUSIC PROOF {direction} • {i}/4"
                  vf=f"drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='{label}':x=55:y=45:fontsize=34:fontcolor=white:box=1:boxcolor=black@0.55:boxborderw=14"
                  fc="[1:a]volume=-18dB,afade=t=in:st=0:d=0.5,afade=t=out:st=25:d=1[m];[0:a]asplit=2[v][key];[m][key]sidechaincompress=threshold=0.035:ratio=3:attack=18:release=260[md];[v][md]amix=inputs=2:duration=first:normalize=0,loudnorm=I=-14:LRA=8:TP=-1.5[a]"
                  subprocess.run(["ffmpeg","-y","-loglevel","error","-ss",str(start),"-t",str(dur),"-i",str(src),
                                  "-stream_loop","-1","-ss",str(offset),"-i",str(root/"music"/track),
                                  "-filter_complex",fc,"-map","0:v:0","-map","[a]","-vf",vf,
                                  "-c:v","libx264","-preset","veryfast","-crf","25","-pix_fmt","yuv420p",
                                  "-c:a","aac","-b:a","160k","-ar","44100","-ac","2","-t",str(dur),str(out)],check=True)
                  clips.append(out)
              lst=root/"out"/f"{direction}_concat.txt"
              lst.write_text("\n".join("file '"+str(x.resolve()).replace("'","'\\''")+"'" for x in clips)+"\n")
              final=root/"out"/f"VIDEO_001_MUSIC_PROOF_{direction}.mp4"
              subprocess.run(["ffmpeg","-y","-loglevel","error","-f","concat","-safe","0","-i",str(lst),
                              "-c","copy","-movflags","+faststart",str(final)],check=True)
              return final

          fa=make("A",A); fb=make("B",B)
          print(fa,fb)
          PY
          ffprobe -v error -show_entries format=duration,size -of compact "$ROOT/out/VIDEO_001_MUSIC_PROOF_A.mp4"
          ffprobe -v error -show_entries format=duration,size -of compact "$ROOT/out/VIDEO_001_MUSIC_PROOF_B.mp4"

      - name: Add proof notes
        shell: bash
        run: |
          ROOT="03_VIDEOS/VIDEO_001_THE_EBAY_HARASSMENT_SCANDAL_THAT_COST_56_MILLION/15C_MUSIC_AB"
          cp "03_VIDEOS/VIDEO_001_THE_EBAY_HARASSMENT_SCANDAL_THAT_COST_56_MILLION/15C_MUSIC_AB_PROOF.md" "$ROOT/out/README.md"
          sha256sum "$ROOT/out/VIDEO_001_MUSIC_PROOF_A.mp4" "$ROOT/out/VIDEO_001_MUSIC_PROOF_B.mp4" > "$ROOT/out/SHA256SUMS.txt"

      - name: Upload A proof
        uses: actions/upload-artifact@v4
        with:
          name: VIDEO_001_MUSIC_PROOF_A
          path: 03_VIDEOS/VIDEO_001_THE_EBAY_HARASSMENT_SCANDAL_THAT_COST_56_MILLION/15C_MUSIC_AB/out/VIDEO_001_MUSIC_PROOF_A.mp4
          retention-days: 30
          compression-level: 0

      - name: Upload B proof
        uses: actions/upload-artifact@v4
        with:
          name: VIDEO_001_MUSIC_PROOF_B
          path: 03_VIDEOS/VIDEO_001_THE_EBAY_HARASSMENT_SCANDAL_THAT_COST_56_MILLION/15C_MUSIC_AB/out/VIDEO_001_MUSIC_PROOF_B.mp4
          retention-days: 30
          compression-level: 0

      - name: Upload proof notes
        uses: actions/upload-artifact@v4
        with:
          name: VIDEO_001_MUSIC_AB_NOTES
          path: |
            03_VIDEOS/VIDEO_001_THE_EBAY_HARASSMENT_SCANDAL_THAT_COST_56_MILLION/15C_MUSIC_AB/out/README.md
            03_VIDEOS/VIDEO_001_THE_EBAY_HARASSMENT_SCANDAL_THAT_COST_56_MILLION/15C_MUSIC_AB/out/SHA256SUMS.txt
          retention-days: 30
