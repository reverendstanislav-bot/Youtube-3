name: VIDEO001 Mixkit Music Audition Pack

on:
  workflow_dispatch:
  push:
    paths:
      - '03_VIDEOS/VIDEO_001_THE_EBAY_HARASSMENT_SCANDAL_THAT_COST_56_MILLION/15C_MUSIC_AUDITION_TRIGGER.txt'

permissions:
  contents: read

jobs:
  build-audition-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg zip

      - name: Download licensed Mixkit candidates
        shell: bash
        run: |
          set -e
          ROOT="03_VIDEOS/VIDEO_001_THE_EBAY_HARASSMENT_SCANDAL_THAT_COST_56_MILLION/15C_MUSIC_AUDITION"
          mkdir -p "$ROOT/full" "$ROOT/previews"
          curl -LfsS 'https://assets.mixkit.co/music/565/565.mp3' -o "$ROOT/full/01_Fallen_Asper_Eugenio_Mininni.mp3"
          curl -LfsS 'https://assets.mixkit.co/music/556/556.mp3' -o "$ROOT/full/02_Xceed_Thru_Johann_Eugenio_Mininni.mp3"
          curl -LfsS 'https://assets.mixkit.co/music/724/724.mp3' -o "$ROOT/full/03_PlaceIt_World_01_Lily_J.mp3"
          curl -LfsS 'https://assets.mixkit.co/music/588/588.mp3' -o "$ROOT/full/04_Feedback_Dreams_Eugenio_Mininni.mp3"
          curl -LfsS 'https://assets.mixkit.co/music/609/609.mp3' -o "$ROOT/full/05_Moon_Walk_Eugenio_Mininni.mp3"
          curl -LfsS 'https://assets.mixkit.co/music/552/552.mp3' -o "$ROOT/full/06_Masking_the_Masters_Eugenio_Mininni.mp3"
          curl -LfsS 'https://assets.mixkit.co/music/597/597.mp3' -o "$ROOT/full/07_Vertigo_Eugenio_Mininni.mp3"
          curl -LfsS 'https://assets.mixkit.co/music/546/546.mp3' -o "$ROOT/full/08_The_Farewell_Eugenio_Mininni.mp3"

      - name: Build normalized previews and audition reel
        shell: bash
        run: |
          set -e
          ROOT="03_VIDEOS/VIDEO_001_THE_EBAY_HARASSMENT_SCANDAL_THAT_COST_56_MILLION/15C_MUSIC_AUDITION"
          python3 - <<'PY'
          import subprocess, pathlib
          root=pathlib.Path("03_VIDEOS/VIDEO_001_THE_EBAY_HARASSMENT_SCANDAL_THAT_COST_56_MILLION/15C_MUSIC_AUDITION")
          tracks=[
          ('01_Fallen_Asper_Eugenio_Mininni.mp3',18),
          ('02_Xceed_Thru_Johann_Eugenio_Mininni.mp3',25),
          ('03_PlaceIt_World_01_Lily_J.mp3',8),
          ('04_Feedback_Dreams_Eugenio_Mininni.mp3',20),
          ('05_Moon_Walk_Eugenio_Mininni.mp3',24),
          ('06_Masking_the_Masters_Eugenio_Mininni.mp3',22),
          ('07_Vertigo_Eugenio_Mininni.mp3',20),
          ('08_The_Farewell_Eugenio_Mininni.mp3',8),
          ]
          for fn,ss in tracks:
              out=root/'previews'/fn.replace('.mp3','_PREVIEW.mp3')
              subprocess.run(['ffmpeg','-y','-loglevel','error','-ss',str(ss),'-i',str(root/'full'/fn),'-t','28',
                  '-af','loudnorm=I=-16:LRA=8:TP=-1.5,afade=t=in:st=0:d=0.35,afade=t=out:st=27:d=1',
                  '-c:a','libmp3lame','-b:a','160k',str(out)],check=True)
          files=sorted((root/'previews').glob('*_PREVIEW.mp3'))
          args=[]; filters=[]; labels=[]
          for i,f in enumerate(files):
              args += ['-i',str(f)]
              filters.append(f'[{i}:a]apad=pad_dur=1[a{i}]')
              labels.append(f'[a{i}]')
          filters.append(''.join(labels)+f'concat=n={len(files)}:v=0:a=1[out]')
          subprocess.run(['ffmpeg','-y','-loglevel','error',*args,'-filter_complex',';'.join(filters),
              '-map','[out]','-c:a','libmp3lame','-b:a','160k',str(root/'VIDEO_001_MIXKIT_MUSIC_AUDITION_REEL.mp3')],check=True)
          PY

      - name: Add license notes and package
        shell: bash
        run: |
          set -e
          ROOT="03_VIDEOS/VIDEO_001_THE_EBAY_HARASSMENT_SCANDAL_THAT_COST_56_MILLION/15C_MUSIC_AUDITION"
          cat > "$ROOT/REEL_TIMECODES.txt" <<'EOF'
          00:00  01 Fallen (Asper)
          00:29  02 Xceed Thru Johann
          00:58  03 PlaceIt World 01
          01:27  04 Feedback Dreams
          01:56  05 Moon Walk
          02:25  06 Masking the Masters
          02:54  07 Vertigo
          03:23  08 The Farewell
          EOF
          cp "03_VIDEOS/VIDEO_001_THE_EBAY_HARASSMENT_SCANDAL_THAT_COST_56_MILLION/15C_MUSIC_REPLACEMENT_RESEARCH.md" "$ROOT/README_LICENSE_AND_MAP.md"
          (cd "$ROOT" && sha256sum full/*.mp3 previews/*.mp3 VIDEO_001_MIXKIT_MUSIC_AUDITION_REEL.mp3 > SHA256SUMS.txt)
          (cd "$ROOT" && zip -qr VIDEO_001_MIXKIT_MUSIC_AUDITION_PACK.zip full previews README_LICENSE_AND_MAP.md REEL_TIMECODES.txt SHA256SUMS.txt)
          ls -lh "$ROOT/VIDEO_001_MIXKIT_MUSIC_AUDITION_PACK.zip" "$ROOT/VIDEO_001_MIXKIT_MUSIC_AUDITION_REEL.mp3"

      - name: Upload audition reel
        uses: actions/upload-artifact@v4
        with:
          name: VIDEO_001_MIXKIT_MUSIC_AUDITION_REEL
          path: 03_VIDEOS/VIDEO_001_THE_EBAY_HARASSMENT_SCANDAL_THAT_COST_56_MILLION/15C_MUSIC_AUDITION/VIDEO_001_MIXKIT_MUSIC_AUDITION_REEL.mp3
          retention-days: 30
          compression-level: 0

      - name: Upload full audition pack
        uses: actions/upload-artifact@v4
        with:
          name: VIDEO_001_MIXKIT_MUSIC_AUDITION_PACK
          path: 03_VIDEOS/VIDEO_001_THE_EBAY_HARASSMENT_SCANDAL_THAT_COST_56_MILLION/15C_MUSIC_AUDITION/VIDEO_001_MIXKIT_MUSIC_AUDITION_PACK.zip
          retention-days: 30
          compression-level: 0
