name: VIDEO004 caption source delivery
on:
  push:
    paths:
      - '.github/workflows/video004_caption_export.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export existing verified word timings
        uses: actions/upload-artifact@v4
        with:
          name: VIDEO004_WORD_LEVEL_TRANSCRIPT_FOR_RENDER
          path: 03_VIDEOS/VIDEO_004_VALVE_STEAM_MASS_ARBITRATION/11_WORD_LEVEL_TRANSCRIPT.json
          if-no-files-found: error
          retention-days: 1
