name: stage12-map-base-acquire
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/stage12-map-base-acquire.yml

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add Natural Earth map base
        run: |
          set -euo pipefail
          BASE="03_VIDEOS/VIDEO_001_THE_EBAY_HARASSMENT_SCANDAL_THAT_COST_56_MILLION/12B_SOURCE_ASSETS"
          mkdir -p "$BASE"
          curl -L --fail --retry 4 --connect-timeout 30 --max-time 300 \
            "https://naturalearth.s3.amazonaws.com/110m_cultural/ne_110m_admin_0_countries.zip" \
            -o "$BASE/NATURAL_EARTH_110M_ADMIN0_COUNTRIES.zip"
          sha256sum "$BASE/NATURAL_EARTH_110M_ADMIN0_COUNTRIES.zip"
          git config user.name "youtube3-source-acquisition"
          git config user.email "youtube3-source-acquisition@users.noreply.github.com"
          rm -f .github/workflows/stage12-map-base-acquire.yml
          git add -f "$BASE/NATURAL_EARTH_110M_ADMIN0_COUNTRIES.zip"
          git add -A
          git commit -m "Add VIDEO_001 Natural Earth map base [skip ci]"
          git push origin HEAD:main
