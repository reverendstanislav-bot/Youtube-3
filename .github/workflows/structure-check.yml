name: youtube3-production-os-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile tooling
        run: python3 -m py_compile tools/*.py
      - name: Validate repository contract
        run: python3 tools/validate_repo.py
      - name: Audit active video packages
        run: python3 tools/audit_video.py --all
