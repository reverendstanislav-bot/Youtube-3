name: VIDEO001 SFX Audibility Microtest

on:
  workflow_dispatch:
  push:
    paths:
      - '03_VIDEOS/VIDEO_001_THE_EBAY_HARASSMENT_SCANDAL_THAT_COST_56_MILLION/15C_SFX_PROOF_TRIGGER.txt'

permissions:
  contents: read

jobs:
  build-sfx-microtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Rebuild canonical Stage15B
        run: |
          python3 "03_VIDEOS/VIDEO_001_THE_EBAY_HARASSMENT_SCANDAL_THAT_COST_56_MILLION/15B_BUILD.py"
      - name: Build controlled SFX audibility microtest
        run: |
          python3 "03_VIDEOS/VIDEO_001_THE_EBAY_HARASSMENT_SCANDAL_THAT_COST_56_MILLION/15C_SFX_MICROTEST_BUILD.py"
      - name: Upload SFX solo reference
        uses: actions/upload-artifact@v4
        with:
          name: VIDEO_001_SFX_SOLO_REFERENCE_V1
          path: 03_VIDEOS/VIDEO_001_THE_EBAY_HARASSMENT_SCANDAL_THAT_COST_56_MILLION/15C_SFX_MICROTEST/out/VIDEO_001_STAGE15C_SFX_SOLO_REFERENCE_V1.mp4
          retention-days: 30
          compression-level: 0
      - name: Upload SFX in-context proof
        uses: actions/upload-artifact@v4
        with:
          name: VIDEO_001_SFX_IN_CONTEXT_PROOF_V1
          path: 03_VIDEOS/VIDEO_001_THE_EBAY_HARASSMENT_SCANDAL_THAT_COST_56_MILLION/15C_SFX_MICROTEST/out/VIDEO_001_STAGE15C_SFX_IN_CONTEXT_PROOF_V1.mp4
          retention-days: 30
          compression-level: 0
      - name: Upload SFX microtest QC
        uses: actions/upload-artifact@v4
        with:
          name: VIDEO_001_SFX_MICROTEST_QC_V1
          path: |
            03_VIDEOS/VIDEO_001_THE_EBAY_HARASSMENT_SCANDAL_THAT_COST_56_MILLION/15C_SFX_MICROTEST/out/VIDEO_001_STAGE15C_SFX_MICROTEST_REPORT_V1.txt
            03_VIDEOS/VIDEO_001_THE_EBAY_HARASSMENT_SCANDAL_THAT_COST_56_MILLION/15C_SFX_MICROTEST/out/VIDEO_001_STAGE15C_SFX_MICROTEST_MEASUREMENTS_V1.csv
          retention-days: 30
